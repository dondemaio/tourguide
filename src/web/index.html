<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tourguide</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="/static/style.css">
<script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script defer src="/static/app.js"></script>
</head>
<body>
<header><h1>Tourguide</h1><a href="/docs">API documentation</a></header>
<main>
<section class="toolbar"><div><h2>Route planner</h2><p id="plan">Loading configured plan…</p></div><button id="calculate" disabled>Calculate route</button></section>
<p id="status" role="status" aria-live="polite"></p>
<section id="totals" class="totals" aria-label="Route totals"></section>
<div class="workspace">
<section class="panel"><h2>Route map</h2><div id="map" aria-label="Interactive route map"></div><p id="map-note"></p><a id="external" hidden target="_blank" rel="noopener noreferrer">Open in Google Maps</a></section>
<section class="panel"><h2>Itinerary</h2><ol id="visits"></ol><h3>Omitted visits</h3><ul id="omitted"></ul></section>
</div>
</main>
</body></html>
