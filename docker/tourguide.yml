services:
    tourguide:
        build:
            context: ../
            dockerfile: docker/Dockerfile.tourguide
        volumes:
            - ../data:/app/data
            - ../data/config.yaml:/app/config.yaml
            - ../src:/app/src
            - ./git-ignored/cache:/app/cache
        depends_on:
            - osrm
        command: "tail -f /dev/null"
        tty: true
    osrm:
        build:
            context: ../
            dockerfile: docker/Dockerfile.osrm
        ports:
            - "5000:5000"
        volumes:
            - ./git-ignored/osrm:/data
        restart: unless-stopped
